[militia]
# Set to false to disable gameplay changes and keep the in-game Mods page.
enabled = true

# Chances per civilian on eligible maps, based on the building at their starting position.
# Untagged shops, food venues, and salons use the commercial chance.
# Supported U.S. maps also use cached GIS data. Shape and neighbors fill the remaining gaps.
# If no footprint is within 3 meters or its use stays unknown, use other_chance_percent.
residential_chance_percent = 4
commercial_chance_percent = 0.025
other_chance_percent = 0.25

# Set to true to enable starting militia on maps in every country.
allow_all_maps = false

# Both players set this to true for co-op. The host's militia rules apply.
allow_coop = false

# Optional comma-separated map file names without ".map", for additional U.S. maps.
extra_us_map_ids =
